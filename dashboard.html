<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>veil — dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f0f0f; color: #e0e0e0; font-family: "Inter", "Segoe UI", sans-serif; font-size: 14px; padding: 32px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: #666; margin-bottom: 24px; font-size: 13px; }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }
    .stat {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 12px 14px;
    }
    .stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #555; margin-bottom: 4px; }
    .stat-value { font-size: 14px; font-weight: 600; color: #e0e0e0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stat-value.on  { color: #43b581; }
    .stat-value.off { color: #e74c3c; }
    .stat-value.dim { color: #666; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 10px;
      padding: 20px;
    }
    .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #555; margin-bottom: 14px; }

    button {
      display: block;
      width: 100%;
      padding: 9px 14px;
      margin-bottom: 8px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #252525;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
      transition: background 0.15s;
    }
    button:hover { background: #2f2f2f; }
    button:last-child { margin-bottom: 0; }
    button:disabled { opacity: 0.4; cursor: default; }

    .btn-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .btn-row button { margin-bottom: 0; }

    .btn-raid   { border-color: #ff6b35; }
    .btn-sub    { border-color: #9147ff; }
    .btn-bits   { border-color: #f5c518; }
    .btn-chat   { border-color: #1e90ff; }
    .btn-yt     { border-color: #ff0000; }
    .btn-danger { border-color: #e74c3c; }
    .btn-success { border-color: #43b581; }
    .btn-active { background: #1e3a2a !important; border-color: #43b581 !important; color: #43b581 !important; }
    .btn-inactive { background: #3a1e1e !important; border-color: #e74c3c !important; color: #e74c3c !important; }

    .divider { border: none; border-top: 1px solid #2a2a2a; margin: 12px 0; }

    .scene-list { display: flex; flex-direction: column; gap: 6px; }
    .scene-btn {
      padding: 8px 12px;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      background: #1f1f1f;
      color: #aaa;
      cursor: pointer;
      font-size: 13px;
      text-align: left;
      transition: all 0.15s;
    }
    .scene-btn:hover { background: #252525; color: #e0e0e0; }
    .scene-btn.active { border-color: #9147ff; background: #1e1a2e; color: #c9a7ff; }

    .event-log {
      background: #111;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      line-height: 1.8;
      height: 200px;
      overflow-y: auto;
      color: #666;
    }
    .event-log .entry { color: #888; }
    .event-log .entry .ts { color: #444; }
    .event-log .entry .type { color: #9147ff; }
    .event-log .entry.alert .type { color: #f5c518; }
    .event-log .entry.chat .type  { color: #1e90ff; }

    .ws-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e74c3c;
      margin-right: 6px;
      vertical-align: middle;
    }
    .ws-dot.connected { background: #43b581; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #252525;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    input[type=text] {
      width: 100%;
      padding: 8px 10px;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      margin-bottom: 8px;
    }

    code { font-family: monospace; font-size: 12px; color: #888; }
  </style>
</head>
<body>

<h1>veil</h1>
<p class="subtitle"><span class="ws-dot" id="ws-dot"></span><span id="ws-label">connecting…</span></p>

<div class="status-grid">
  <div class="stat"><div class="stat-label">Scene</div><div class="stat-value dim" id="st-scene">—</div></div>
  <div class="stat"><div class="stat-label">Chat</div><div class="stat-value" id="st-chat">—</div></div>
  <div class="stat"><div class="stat-label">Twitch source</div><div class="stat-value" id="st-twitch">—</div></div>
  <div class="stat"><div class="stat-label">YouTube source</div><div class="stat-value" id="st-youtube">—</div></div>
  <div class="stat"><div class="stat-label">Alerts</div><div class="stat-value" id="st-alerts">—</div></div>
  <div class="stat"><div class="stat-label">Alert audio</div><div class="stat-value" id="st-audio">—</div></div>
  <div class="stat"><div class="stat-label">Discord VC</div><div class="stat-value dim" id="st-discord">0 members</div></div>
  <div class="stat"><div class="stat-label">WS clients</div><div class="stat-value dim" id="st-ws">—</div></div>
</div>

<div class="grid">

  <!-- ALERTS -->
  <div class="card">
    <h2>Test Alerts</h2>
    <button class="btn-sub"  onclick="fire('/test/alert/sub')">▶ Sub</button>
    <button class="btn-sub"  onclick="fire('/test/alert/resub')">▶ Resub (6 months)</button>
    <button class="btn-sub"  onclick="fire('/test/alert/giftsub')">▶ Gift Sub</button>
    <button class="btn-sub"  onclick="fire('/test/alert/giftbomb')">▶ Gift Bomb (×10)</button>
    <button class="btn-raid" onclick="fire('/test/alert/raid')">▶ Raid (42 viewers)</button>
    <button class="btn-bits" onclick="fire('/test/alert/bits')">▶ Bits (500)</button>
    <button onclick="fire('/test/alert/channel_point')">▶ Channel Point Redeem</button>
    <button onclick="fire('/test/alert/follower')">▶ Follower</button>
    <hr class="divider">
    <div class="btn-row">
      <button id="btn-alerts-on"  class="btn-success" onclick="fire('/alerts/on')">Alerts ON</button>
      <button id="btn-alerts-off" class="btn-danger"  onclick="fire('/alerts/off')">Alerts OFF</button>
    </div>
    <div class="btn-row">
      <button id="btn-audio-on"  class="btn-success" onclick="fire('/alerts/audio/on')">Audio ON</button>
      <button id="btn-audio-off" class="btn-danger"  onclick="fire('/alerts/audio/off')">Audio OFF</button>
    </div>
    <button class="btn-danger" onclick="fire('/alerts/queue/clear')">Clear Alert Queue</button>
  </div>

  <!-- CHAT -->
  <div class="card">
    <h2>Chat</h2>
    <input type="text" id="chat-msg" placeholder="Test message…" value="Hello from the test dashboard!">
    <div class="btn-row">
      <button class="btn-chat" onclick="sendChat('twitch')">▶ Send as Twitch</button>
      <button class="btn-yt"   onclick="sendChat('youtube')">▶ Send as YouTube</button>
    </div>
    <hr class="divider">
    <button onclick="fire('/chat/toggle')">Toggle Chat Visibility</button>
    <div class="btn-row">
      <button onclick="fire('/chat/source/twitch?enabled=true')">Twitch ON</button>
      <button onclick="fire('/chat/source/twitch?enabled=false')">Twitch OFF</button>
    </div>
    <div class="btn-row">
      <button class="btn-yt" onclick="fire('/chat/source/youtube?enabled=true')">YouTube ON</button>
      <button onclick="fire('/chat/source/youtube?enabled=false')">YouTube OFF</button>
    </div>
  </div>

  <!-- OBS SCENES -->
  <div class="card">
    <h2>OBS Scenes</h2>
    <div class="scene-list" id="scene-list">
      <span style="color:#444; font-size:12px;">Loading scenes…</span>
    </div>
    <button style="margin-top:12px;" onclick="loadScenes()">↺ Refresh Scenes</button>
  </div>

  <!-- DISCORD VC -->
  <div class="card">
    <h2>Discord Voice</h2>
    <input type="text" id="dc-name" placeholder="Display name…" value="GuestUser">
    <button onclick="fireWithName('/test/discord/join', 'dc-name')">▶ Join Voice</button>
    <button onclick="fireWithName('/test/discord/leave', 'dc-name')">Leave Voice</button>
    <div class="btn-row">
      <button onclick="fireWithNameAndParam('/test/discord/speaking', 'dc-name', 'speaking=true')">Speaking ON</button>
      <button onclick="fireWithNameAndParam('/test/discord/speaking', 'dc-name', 'speaking=false')">Speaking OFF</button>
    </div>
  </div>

  <!-- EVENT LOG -->
  <div class="card">
    <h2>Live Event Log</h2>
    <div class="event-log" id="event-log">
      <span style="color:#333;">Waiting for events…</span>
    </div>
  </div>

  <!-- OVERLAY URLS -->
  <div class="card">
    <h2>Overlay URLs (OBS Browser Sources)</h2>
    <p style="color:#555; font-size:12px; line-height:2.2;">
      Chat<br><code id="url-chat"></code><br>
      Alerts<br><code id="url-alerts"></code><br>
      Discord VC<br><code id="url-discord"></code>
    </p>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const base = window.location.origin;
  document.getElementById("url-chat").textContent    = `${base}/overlays/chat.html`;
  document.getElementById("url-alerts").textContent  = `${base}/overlays/alerts.html`;
  document.getElementById("url-discord").textContent = `${base}/overlays/discord_vc.html`;

  // ── Status ──────────────────────────────────────────────────────────────────

  function applyStatus(d) {
    const set = (id, val, cls) => {
      const el = document.getElementById(id);
      el.textContent = val;
      el.className = "stat-value" + (cls ? " " + cls : "");
    };

    set("st-scene",   d.current_scene || "—",          d.current_scene ? "" : "dim");
    set("st-chat",    d.chat_visible ? "visible" : "hidden", d.chat_visible ? "on" : "off");
    set("st-twitch",  d.chat_sources?.twitch  ? "enabled" : "disabled", d.chat_sources?.twitch  ? "on" : "off");
    set("st-youtube", d.chat_sources?.youtube ? "enabled" : "disabled", d.chat_sources?.youtube ? "on" : "off");
    set("st-alerts",  d.alerts_enabled ? "enabled" : "disabled",       d.alerts_enabled ? "on" : "off");
    set("st-audio",   d.alerts_audio_enabled ? "enabled" : "disabled", d.alerts_audio_enabled ? "on" : "off");

    const members = Array.isArray(d.discord_members) ? d.discord_members.length : 0;
    set("st-discord", `${members} member${members !== 1 ? "s" : ""}`, members ? "" : "dim");

    if (d.ws_connections !== undefined) {
      set("st-ws", `${d.ws_connections} client${d.ws_connections !== 1 ? "s" : ""}`, "dim");
    }
  }

  async function refreshStatus() {
    try {
      const r = await fetch("/status");
      const d = await r.json();
      applyStatus(d);
    } catch { /* ignore — WS is the live source anyway */ }
  }
  refreshStatus();
  setInterval(refreshStatus, 4000);

  // ── OBS Scenes ──────────────────────────────────────────────────────────────

  let _currentScene = "";

  async function loadScenes() {
    const list = document.getElementById("scene-list");
    try {
      const r = await fetch("/scenes");
      if (!r.ok) throw new Error(r.statusText);
      const d = await r.json();
      _currentScene = d.current;
      renderScenes(d.scenes, d.current);
    } catch (e) {
      list.innerHTML = `<span style="color:#444;font-size:12px;">OBS not connected</span>`;
    }
  }

  function renderScenes(scenes, current) {
    const list = document.getElementById("scene-list");
    if (!scenes.length) {
      list.innerHTML = `<span style="color:#444;font-size:12px;">No scenes found</span>`;
      return;
    }
    list.innerHTML = "";
    scenes.forEach(s => {
      const btn = document.createElement("button");
      btn.className = "scene-btn" + (s === current ? " active" : "");
      btn.textContent = s;
      btn.onclick = () => switchScene(s);
      list.appendChild(btn);
    });
  }

  async function switchScene(scene) {
    const r = await fetch("/scenes/switch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ scene }),
    });
    const d = await r.json();
    if (d.ok) {
      _currentScene = scene;
      document.querySelectorAll(".scene-btn").forEach(b => {
        b.classList.toggle("active", b.textContent === scene);
      });
      toast(`✓ switched to ${scene}`);
    } else {
      toast("✗ scene switch failed");
    }
  }

  loadScenes();

  // ── Event Log ───────────────────────────────────────────────────────────────

  const MAX_LOG = 40;
  const _logEntries = [];

  function logEvent(type, summary) {
    const ts = new Date().toLocaleTimeString("en-US", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
    _logEntries.unshift({ ts, type, summary });
    if (_logEntries.length > MAX_LOG) _logEntries.pop();
    renderLog();
  }

  function renderLog() {
    const el = document.getElementById("event-log");
    el.innerHTML = _logEntries.map(e => {
      const cls = e.type.startsWith("alert") ? "alert" : e.type.startsWith("chat") ? "chat" : "";
      return `<div class="entry ${cls}"><span class="ts">${e.ts}</span> <span class="type">${e.type}</span> <span>${e.summary}</span></div>`;
    }).join("");
  }

  function summarise(type, data) {
    if (!data) return "";
    if (type === "alert.trigger")    return `${data.alert_type} — ${data.display_name || data.from_display_name || ""}`;
    if (type === "chat.message")     return `${data.display_name}: ${(data.message || "").slice(0, 60)}`;
    if (type === "scene.switch")     return data.scene || "";
    if (type === "overlay.toggle")   return `${data.overlay} → ${data.visible ? "visible" : "hidden"}`;
    if (type === "chat.source.toggle") return `${data.platform} → ${data.enabled ? "on" : "off"}`;
    if (type === "alerts.toggle")    return data.enabled ? "enabled" : "disabled";
    if (type === "alerts.audio.toggle") return data.enabled ? "enabled" : "disabled";
    if (type === "state.sync")       return "initial sync";
    if (type === "config.update")    return "config reloaded";
    return JSON.stringify(data).slice(0, 80);
  }

  // ── WebSocket ────────────────────────────────────────────────────────────────

  const wsUrl = `ws://${window.location.host}/ws`;
  const dot   = document.getElementById("ws-dot");
  const label = document.getElementById("ws-label");

  function connectWS() {
    const ws = new WebSocket(wsUrl);

    ws.onopen = () => {
      dot.classList.add("connected");
      label.textContent = "connected";
    };

    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      const { type, data } = msg;

      // Update status pane from sync messages
      if (type === "state.sync" && data) applyStatus(data);
      if (type === "scene.switch" && data?.scene) {
        _currentScene = data.scene;
        document.querySelectorAll(".scene-btn").forEach(b => {
          b.classList.toggle("active", b.textContent === data.scene);
        });
        document.getElementById("st-scene").textContent = data.scene;
        document.getElementById("st-scene").className = "stat-value";
      }
      if (type === "overlay.toggle" && data?.overlay === "chat") {
        const el = document.getElementById("st-chat");
        el.textContent = data.visible ? "visible" : "hidden";
        el.className = "stat-value " + (data.visible ? "on" : "off");
      }
      if (type === "chat.source.toggle") {
        const el = document.getElementById(`st-${data.platform}`);
        if (el) {
          el.textContent = data.enabled ? "enabled" : "disabled";
          el.className = "stat-value " + (data.enabled ? "on" : "off");
        }
      }
      if (type === "alerts.toggle") {
        const el = document.getElementById("st-alerts");
        el.textContent = data.enabled ? "enabled" : "disabled";
        el.className = "stat-value " + (data.enabled ? "on" : "off");
      }
      if (type === "alerts.audio.toggle") {
        const el = document.getElementById("st-audio");
        el.textContent = data.enabled ? "enabled" : "disabled";
        el.className = "stat-value " + (data.enabled ? "on" : "off");
      }

      logEvent(type, summarise(type, data));
    };

    ws.onclose = () => {
      dot.classList.remove("connected");
      label.textContent = "disconnected — reconnecting…";
      setTimeout(connectWS, 3000);
    };
  }

  connectWS();

  // ── Helpers ──────────────────────────────────────────────────────────────────

  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 2000);
  }

  async function fire(url) {
    try {
      const r = await fetch(url, { method: "POST" });
      const d = await r.json();
      toast(d.ok ? `✓ ${url.split("/").pop().split("?")[0]}` : `✗ ${JSON.stringify(d)}`);
    } catch {
      toast(`✗ request failed`);
    }
  }

  async function sendChat(platform = "twitch") {
    const msg = document.getElementById("chat-msg").value;
    await fire(`/test/chat?message=${encodeURIComponent(msg)}&platform=${platform}`);
  }

  async function fireWithName(url, inputId) {
    const name = document.getElementById(inputId).value || "GuestUser";
    await fire(`${url}?display_name=${encodeURIComponent(name)}`);
  }

  async function fireWithNameAndParam(url, inputId, extra) {
    const name = document.getElementById(inputId).value || "GuestUser";
    await fire(`${url}?display_name=${encodeURIComponent(name)}&${extra}`);
  }
</script>

</body>
</html>
